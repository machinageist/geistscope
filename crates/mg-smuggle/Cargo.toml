[package]
name = "mg-smuggle"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-smuggle"
path = "src/main.rs"

[dependencies]
engagement = { path = "../engagement" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"
