# Author: Jeff
# Date: 2026-05-25
# Description: mg-webscan — merged active web-vulnerability scanner suite
# Notes: Subcommand-routed; replaces mg-xss, mg-sqli, mg-ssrf, mg-ssti, mg-xxe,
#        mg-traversal, mg-redirect, mg-csrf, mg-cmdinject, mg-cors-exploit,
#        mg-cache-poison, mg-proto-pollute, mg-deser, mg-smuggle.
[package]
name = "mg-webscan"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-webscan"
path = "src/main.rs"

[dependencies]
engagement = { path = "../engagement" }
session = { path = "../session" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros"] }
url = "2"
regex = "1"
base64 = "0.22"
bytes = "1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
