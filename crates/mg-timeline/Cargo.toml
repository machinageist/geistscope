[package]
name = "mg-timeline"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-timeline"
path = "src/main.rs"

[dependencies]
engagement = { path = "../engagement" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
