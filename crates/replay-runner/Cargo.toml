[package]
name = "replay-runner"
version = "0.1.0"
edition = "2024"

[lib]
name = "replay_runner"
path = "src/lib.rs"

[dependencies]
replay-engine = { path = "../replay-engine" }
http-client = { path = "../http-client" }
thiserror = "2"

[dev-dependencies]
request-corpus = { path = "../request-corpus" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
