[package]
name = "mg-oob"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-oob"
path = "src/main.rs"

[dependencies]
engagement = { path = "../engagement" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"
