[package]
name = "mg-jwt"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-jwt"
path = "src/main.rs"

[dependencies]
engagement = { path = "../engagement" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
