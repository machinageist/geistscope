[package]
name = "mg-hunt"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-hunt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
request-corpus = { path = "../request-corpus" }
replay-engine = { path = "../replay-engine" }
evidence-core = { path = "../evidence-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
