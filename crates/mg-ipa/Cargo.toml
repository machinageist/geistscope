[package]
name = "mg-ipa"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-ipa"
path = "src/main.rs"

[dependencies]
engagement = { path = "../engagement" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
zip = "2"
regex = "1"
