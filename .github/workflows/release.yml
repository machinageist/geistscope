name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (vX.Y.Z)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: ${{ matrix.target }}
      - name: Build release binaries
        working-directory: crates
        run: cargo build --workspace --release --target ${{ matrix.target }} --locked
      - name: Stage and strip binaries
        working-directory: crates
        run: |
          mkdir -p ../dist
          OUT="target/${{ matrix.target }}/release"
          # Copy every workspace bin: mg-*, ai-prioritize, corpus-builder, subdomain-enum
          for name in mg-* ai-prioritize corpus-builder subdomain-enum; do
            for f in "$OUT"/$name; do
              if [ -f "$f" ] && [ -x "$f" ]; then
                strip "$f" 2>/dev/null || true
                cp "$f" "../dist/$(basename "$f")"
              fi
            done
          done
          ls -lh ../dist
      - name: Package archive
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          ARCHIVE="geistscope-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist .
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: geistscope-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
