[package]
name = "mg-lab"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mg-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
browser-lab = { path = "../browser-lab" }
clap = { version = "4.5", features = ["derive"] }
lab-model = { path = "../lab-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
